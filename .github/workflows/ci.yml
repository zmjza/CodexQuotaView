name: CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS Swift tests and fixtures
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Show Swift version
        run: swift --version
      - name: Validate shared fixtures
        run: python3 scripts/validate-fixtures.py
      - name: Build package
        run: swift build
      - name: Run tests
        run: swift test

  windows:
    name: Windows .NET tests and fixtures
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Windows/CodexQuotaView.sln
      - name: Build
        run: dotnet build Windows/CodexQuotaView.sln -c Release --no-restore
      - name: Run tests
        run: dotnet test Windows/tests/CodexQuotaView.Core.Tests/CodexQuotaView.Core.Tests.csproj -c Release --no-build
      - name: Validate shared fixtures
        run: dotnet run --project Windows/src/CodexQuotaView.FixtureRunner/CodexQuotaView.FixtureRunner.csproj -c Release
      - name: Smoke test backend selection
        run: dotnet run --project Windows/tests/CodexQuotaView.Smoke/CodexQuotaView.Smoke.csproj -c Release

  windows-app:
    name: Windows WinUI x64 app and native rendering
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build native rendering
        run: msbuild Windows/src/CodexQuotaView.Rendering.Native/CodexQuotaView.Rendering.Native.vcxproj -p:Configuration=Release -p:Platform=x64 -restore
      - name: Build WinUI app
        run: dotnet build Windows/src/CodexQuotaView.App/CodexQuotaView.App.csproj -c Release -p:Platform=x64 -r win-x64
      - name: Copy native rendering into app output
        shell: pwsh
        run: |
          Copy-Item -Force "Windows/src/CodexQuotaView.Rendering.Native/x64/Release/CodexQuotaViewRendering.dll" "Windows/src/CodexQuotaView.App/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/"
      - name: Rendering offscreen frame smoke
        run: dotnet run --project Windows/tests/CodexQuotaView.Rendering.Smoke/CodexQuotaView.Rendering.Smoke.csproj -c Release
      - name: Launch app and capture overview screenshot
        shell: pwsh
        run: |
          $exe = "Windows/src/CodexQuotaView.App/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/CodexQuotaView.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--screenshot" -WorkingDirectory (Get-Location) -PassThru
          $process.WaitForExit(20000) | Out-Null
          if (Test-Path "overview.png") {
            Write-Host "overview screenshot captured"
          } else {
            Write-Host "overview screenshot not found (headless capture may be unsupported)"
          }
      - name: Upload overview screenshot
        uses: actions/upload-artifact@v4
        with:
          name: windows-overview
          path: overview.png
          if-no-files-found: warn
